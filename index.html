<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plum - R : Ultimate Melody Rhythm + Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0; padding: 0; background-color: #050510; color: white;
            font-family: 'Inter', sans-serif;
            overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
        }
        #gameCanvas { display: block; width: 100vw; height: 100vh; }
        
        #uiLayer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10;
        }
        
        .panel {
            background: rgba(10, 15, 25, 0.95); backdrop-filter: blur(12px);
            border: 2px solid #0ff; padding: 22px; border-radius: 16px;
            text-align: center; pointer-events: auto; box-shadow: 0 0 35px rgba(0, 255, 255, 0.4);
            max-width: 480px; width: 90%; max-height: 90vh; overflow-y: auto;
        }
        
        h1 { margin: 0 0 8px 0; font-size: 20px; color: #0ff; text-shadow: 0 0 15px #0ff; font-weight: 800; }
        p { margin: 5px 0; color: #bbb; font-size: 12px; line-height: 1.3; }
        
        .btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
        
        button {
            padding: 10px 18px; font-size: 14px; font-weight: bold;
            background: rgba(0, 255, 255, 0.1); color: #0ff; border: 2px solid #0ff;
            border-radius: 8px; cursor: pointer; transition: 0.2s;
            text-shadow: 0 0 10px #0ff; width: 100%;
        }
        button:hover { background: #0ff; color: #000; box-shadow: 0 0 25px #0ff; }
        
        .btn-editor { border-color: #ff00ff; color: #ff00ff; text-shadow: 0 0 10px #ff00ff; background: rgba(255, 0, 255, 0.1); }
        .btn-editor:hover { background: #ff00ff; color: #000; box-shadow: 0 0 25px #ff00ff; }

        .file-box {
            margin: 10px 0; padding: 10px; background: rgba(0, 255, 255, 0.05);
            border: 1px dashed #0ff; border-radius: 8px; text-align: left;
        }
        .file-box label { display: block; font-size: 11px; color: #0ff; margin-bottom: 4px; font-weight: bold; }
        input[type="file"] { font-size: 12px; color: #fff; width: 100%; cursor: pointer; }

        #messageBox {
            margin-top: 8px; font-size: 12px; color: #ff0; font-weight: bold; display: none;
            text-shadow: 0 0 10px #ff0;
        }
        
        #hud {
            position: absolute; top: 20px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; align-items: flex-start;
            font-weight: bold; pointer-events: none; z-index: 5; display: none;
        }
        .hud-left { display: flex; flex-direction: column; }
        #scoreDisplay { text-shadow: 0 0 10px #fff; font-size: 20px; }
        #hpBarContainer { width: 160px; height: 10px; background: #333; border: 2px solid #fff; margin-top: 6px; border-radius: 4px; overflow: hidden; }
        #hpBar { width: 100%; height: 100%; background: #0f0; transition: width 0.1s; }
        #comboDisplay { font-size: 26px; color: #ff00ff; text-shadow: 0 0 20px #ff00ff; text-align: right; }
        
        #mobileGuide {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 18vh;
            display: flex; pointer-events: none; opacity: 0.3; z-index: 1; display: none;
        }
        .guide-zone { flex: 1; border-left: 1px dashed rgba(255,255,255,0.4); border-right: 1px dashed rgba(255,255,255,0.4); display: flex; justify-content: center; align-items: center; font-size: 1.4em; font-weight: bold; color: white; }

        .checkbox-container {
            margin-top: 6px; font-size: 12px; color: #fff; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; accent-color: #0ff; }
        
        #modeIndicator {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            font-size: 18px; font-weight: bold; color: #ff00ff; text-shadow: 0 0 15px #ff00ff; z-index: 6; display: none;
        }

        #countdownOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            font-size: 90px; font-weight: 900; color: #0ff; text-shadow: 0 0 40px #0ff;
            z-index: 20; pointer-events: none; display: none;
        }
        
        .map-select-row {
            display: flex; gap: 6px; margin-top: 6px;
        }
        .map-btn {
            flex: 1; padding: 8px; font-size: 12px; border-radius: 8px; cursor: pointer; border: 2px solid #555; background: rgba(255,255,255,0.05); color: #aaa; text-shadow: none; width: auto;
        }
        .map-btn.selected {
            border-color: #0ff; background: rgba(0,255,255,0.2); color: #0ff; text-shadow: 0 0 8px #0ff;
        }
    </style>
</head>

    <canvas id="gameCanvas"></canvas>

    <div id="countdownOverlay">3</div>

    <div id="mobileGuide">

    <div id="hud">

            <div id="hpBarContainer"><div id="hpBar"></div></div>
        </div>
        <div id="comboDisplay"></div>
    </div>
    
    <div id="uiLayer">
        <div class="panel" id="startPanel">

            <p>PC: D, F, J, K | 모바일: 4등분 터치</p>
            
            <div class="file-box">

                <input type="file" id="songFileInput" accept="audio/*, video/*">
            </div>

            <div class="file-box" style="text-align: left;">
                <label>🗺️ 플레이할 맵 선택 및 관리</label>
                <div class="map-select-row">
                    <button type="button" id="mapDefaultBtn" class="map-btn">🤖 기본 자동 맵</button>
                    <button type="button" id="mapCustomBtn" class="map-btn selected">💾 내 커스텀 맵</button>
                </div>
                <div style="display: flex; gap: 6px; margin-top: 6px;">
                    <button type="button" id="exportMapBtn" class="map-btn" style="background: rgba(255,0,255,0.1); border-color:#ff00ff; color:#ff00ff;">💾 맵 파일로 저장</button>
                    <input type="file" id="importMapInput" accept=".json" style="display: none;">
                    <button type="button" id="importMapBtn" class="map-btn" style="background: rgba(0,255,255,0.1);">📂 맵 파일 불러오기</button>
                </div>
            </div>

            <div class="checkbox-container">
                <input type="checkbox" id="invincibleMode" checked>
                <label for="invincibleMode">무적 모드 (게임 오버 없음)</label>
            </div>

            <div class="btn-group">
                <button id="startBtn">🎮 게임 시작</button>
                <button id="editorBtn" class="btn-editor">✍️ 에디터로 맵 만들기 (녹화)</button>
            </div>
            
            <div id="messageBox">준비 완료</div>
        </div>
    </div>

        function processCustomChart(notesArray) {
            if (!notesArray || notesArray.length === 0) return [];
            notesArray.sort((a, b) => a.time - b.time);
            let total = notesArray.length;
            
            // Find bursts (rapid sections where time difference < 0.3s)
            let bursts = [];
            let currentBurst = [0];
            for (let i = 1; i < total; i++) {
                if (notesArray[i].time - notesArray[i-1].time < 0.3) {

                } else {
                    if (currentBurst.length >= 4) bursts.push([...currentBurst]);

            if (currentBurst.length >= 4) bursts.push(currentBurst);

            let forwardIndices = new Set();
            let reverseIndex = -1;

            if (bursts.length >= 4) {
                forwardIndices.add(Math.floor(bursts.length * 0.2));
                forwardIndices.add(Math.floor(bursts.length * 0.5));
                forwardIndices.add(Math.floor(bursts.length * 0.8));
                reverseIndex = Math.floor(bursts.length * 0.65);
                if (reverseIndex === Math.floor(bursts.length * 0.5)) reverseIndex = Math.min(bursts.length - 1, reverseIndex + 1);
            } else if (bursts.length > 0) {
                forwardIndices.add(0);
                if (bursts.length > 1) reverseIndex = 1;
            }

            let isNoteInBurst = (idx) => {
                for (let b = 0; bysts = bursts, b < bursts.length; b++) {
                    if (bursts[b].includes(idx)) return { inBurst: true, burstId: b, pos: bursts[b].indexOf(idx) };

                return { inBurst: false };

            } else {
                showMsg("기본 음악 불러오는 중...");
                const res = await fetch("mp4.mp4");
                if (!res.ok) throw new Error("Default fetch failed");
                const buf = await res.arrayBuffer();
                return await audioCtx.decodeAudioData(buf);
            }
        }

        async function runCountdownAndStart(callback) {
            startPanel.style.pointerEvents = 'none';
            isInvincible = invincibleMode.checked;
            startPanel.style.display = 'none';
            countdownOverlay.style.display = 'flex';

            let count = 3;
            countdownOverlay.innerText = count;

            let timer = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownOverlay.innerText = count;
                } else if (count === 0) {
                    countdownOverlay.innerText = "START!";
                } else {
                    clearInterval(timer);
                    countdownOverlay.style.display = 'none';
                    callback();
                }
            }, 1000);
        }

        async function initGameSession(mode) {
            isEditorMode = (mode === 'editor');
            try {
                if (!audioBufferGlobal) {
                    audioBufferGlobal = await getAudioBuffer();
                }

                if (!isEditorMode) {
                    if (selectedMap === 'custom') {
                        notes = [...customChartNotes];
                    } else {
                        generateMelodyPattern(audioBufferGlobal);
                    }
                }

                runCountdownAndStart(() => {
                    if (isEditorMode) {
                        startEditor(audioBufferGlobal);
                    } else {
                        startGame(audioBufferGlobal);
                    }
                });
            } catch (err) {
                console.warn(err);
                startPanel.style.display = 'block';
                startPanel.style.pointerEvents = 'auto';
                countdownOverlay.style.display = 'none';
                showMsg("❌ 음악 로드 실패! [노래 파일 선택]에서 본인의 음악 파일을 골라주세요.");
            }
        }

        startBtn.addEventListener('click', () => initGameSession('play'));
        editorBtn.addEventListener('click', () => initGameSession('editor'));

        function showMsg(msg) {
            messageBox.style.display = 'block';
            messageBox.innerText = msg;
        }

        function generateMelodyPattern(buffer) {
            notes = [];
            const channelData = buffer.getChannelData(0);
            const sampleRate = buffer.sampleRate;
            const windowSize = Math.floor(sampleRate * 0.015); 
            const steps = Math.floor(channelData.length / windowSize);
            
            let energies = new Float32Array(steps);
            for (let i = 0; i < steps; i++) {
                let sum = 0;
                for (let j = 0; j < windowSize; j++) {
                    let val = channelData[i * windowSize + j];
                    sum += val * val;
                }
                energies[i] = Math.sqrt(sum / windowSize);
            }

            let lastNoteTime = -1;
            let lastLane = 0;
            const windowWidth = 25;

            for (let i = windowWidth; i < steps - windowWidth; i++) {
                let localSum = 0;
                for (let j = -windowWidth; j <= windowWidth; j++) {
                    localSum += energies[i + j];
                }
                let localAvg = localSum / (windowWidth * 2 + 1);
                
                const time = (i * windowSize) / sampleRate;
                let threshold = localAvg * 1.35;

                if (energies[i] > threshold && energies[i] > 0.005) {
                    if (time - lastNoteTime < 0.13) continue; 

                    let lane = (lastLane + 1 + Math.floor(Math.random() * 2)) % LANES;
                    if (lane === lastLane) lane = (lane + 1) % LANES;

                    notes.push({ lane: lane, time: time, hit: false, missed: false });
                    lastLane = lane;
                    lastNoteTime = time;
                }
            }
        }

        function startEditor(buffer) {
            modeIndicator.style.display = 'block';
            hud.style.display = 'flex';
            
            gameScore = 0; combo = 0; hp = 100;
            recordedNotes = [];
            updateHUD();

            sourceNode = audioCtx.createBufferSource();
            sourceNode.buffer = buffer;
            sourceNode.connect(audioCtx.destination);
            sourceNode.onended = () => finishEditor();
            
            startTime = audioCtx.currentTime; 
            sourceNode.start(startTime);
            
            isPlaying = true;
            requestAnimationFrame(editorLoop);
        }

        function finishEditor() {
            isPlaying = false;
            if (sourceNode) { try { sourceNode.stop(); } catch(e){} }
            modeIndicator.style.display = 'none';
            hud.style.display = 'none';

            startPanel.style.display = 'block';
            startPanel.style.pointerEvents = 'auto';
            countdownOverlay.style.display = 'none';

            if (recordedNotes.length === 0) {
                showMsg("❌ 녹화된 노트가 없습니다! D, F, J, K 키를 눌러주세요.");
                return;
            }

            customChartNotes = processCustomChart([...recordedNotes]);
            selectedMap = 'custom';
            mapCustomBtn.classList.add('selected');
            mapDefaultBtn.classList.remove('selected');

            showMsg(`💾 채보 저장 완료! (총 ${customChartNotes.length}개 노트: 계단 3회, 역계단 1회 적용)`);
            titleText.innerText = "채보 저장 완료!";
            titleText.style.color = "#ff00ff";
            startBtn.innerText = "🎮 게임 시작";
        }

        let lastTime = performance.now();
        
        function editorLoop(time) {
            if (!isPlaying) return;
            requestAnimationFrame(editorLoop);

            const dt = (time - lastTime) / 1000;
            lastTime = time;

            LANE_WIDTH = Math.min(110, w / LANES);
            START_X = (w - (LANE_WIDTH * LANES)) / 2;
            JUDGMENT_Y = h - JUDGMENT_Y_OFFSET;

            ctx.fillStyle = '#050510';
            ctx.fillRect(0, 0, w, h);

            drawLanes();
            updateAndDrawParticles(dt);
        }

        function startGame(buffer) {
            hud.style.display = 'flex';
            
            gameScore = 0; combo = 0; maxCombo = 0; hp = 100;
            updateHUD();

            sourceNode = audioCtx.createBufferSource();
            sourceNode.buffer = buffer;
            sourceNode.connect(audioCtx.destination);
            sourceNode.onended = () => endGame("TRACK CLEARED!");
            
            startTime = audioCtx.currentTime; 
            sourceNode.start(startTime);
            
            isPlaying = true;
            requestAnimationFrame(gameLoop);
        }

        function endGame(msg) {
            isPlaying = false;
            if (sourceNode) { try { sourceNode.stop(); } catch(e){} }
            hud.style.display = 'none';
            startPanel.style.display = 'block';
            startPanel.style.pointerEvents = 'auto';
            
            titleText.innerText = msg;
            titleText.style.color = msg === "GAME OVER" ? "#ff0055" : "#0ff";
            
            let p = startPanel.querySelectorAll('p');
            if(p[1]) p[1].innerHTML = `MAX COMBO: ${maxCombo} <br> SCORE: ${gameScore}`;
            
            startBtn.innerText = "RESTART (다시 시작)";
        }
        
        function gameLoop(time) {
            if (!isPlaying) return;
            requestAnimationFrame(gameLoop);

            const dt = (time - lastTime) / 1000;
            lastTime = time;

            const now = audioCtx.currentTime - startTime + SYNC_OFFSET;

            LANE_WIDTH = Math.min(110, w / LANES);
            START_X = (w - (LANE_WIDTH * LANES)) / 2;
            JUDGMENT_Y = h - JUDGMENT_Y_OFFSET;

            ctx.fillStyle = '#050510';
            ctx.fillRect(0, 0, w, h);

            drawLanes();
            updateAndDrawNotes(now);
            updateAndDrawParticles(dt);
        }

        function drawLanes() {
            ctx.lineWidth = 2;
            for (let i = 0; i < LANES; i++) {
                const x = START_X + i * LANE_WIDTH;
                
                ctx.fillStyle = hitEffects[i] > 0 ? 'rgba(0, 255, 255, 0.25)' : 'rgba(255, 255, 255, 0.02)';
                ctx.fillRect(x, 0, LANE_WIDTH, h);
                hitEffects[i] = Math.max(0, hitEffects[i] - 0.08);
                
                ctx.strokeStyle = 'rgba(0, 255, 255, 0.25)';
                ctx.beginPath();
                ctx.moveTo(x, 0); ctx.lineTo(x, h);
                ctx.stroke();
                
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.font = '18px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(['D', 'F', 'J', 'K'][i], x + LANE_WIDTH/2, JUDGMENT_Y + 35);
            }
            
            ctx.beginPath();
            ctx.moveTo(START_X + LANES * LANE_WIDTH, 0); 
            ctx.lineTo(START_X + LANES * LANE_WIDTH, h);
            ctx.stroke();

            ctx.strokeStyle = '#0ff';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#0ff';
            ctx.beginPath();
            ctx.moveTo(START_X, JUDGMENT_Y);
            ctx.lineTo(START_X + LANES * LANE_WIDTH, JUDGMENT_Y);
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        function updateAndDrawNotes(now) {
            for (let i = 0; i < notes.length; i++) {
                let note = notes[i];
                if (note.hit || note.missed) continue;

                const timeDiff = note.time - now;
                const y = JUDGMENT_Y - (timeDiff * NOTE_SPEED);

                if (timeDiff < -JUDGE.GOOD) {
                    note.missed = true;
                    processHitResult('MISS');
                    continue;
                }

                if (y > -50 && y < h + 50) {
                    const x = START_X + note.lane * LANE_WIDTH;
                    
                    ctx.fillStyle = 'rgba(0, 255, 255, 0.85)';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#0ff';
                    
                    ctx.fillRect(x + 4, y - 10, LANE_WIDTH - 8, 20);
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(x + 8, y - 5, LANE_WIDTH - 16, 10);
                    ctx.shadowBlur = 0;
                }
            }
        }

        const KEYS = ['d', 'f', 'j', 'k'];
        
        window.addEventListener('keydown', (e) => {
            if (!isPlaying || e.repeat) return;
            const lane = KEYS.indexOf(e.key.toLowerCase());
            if (lane !== -1) {
                if (isEditorMode) {
                    handleEditorInput(lane);
                } else {
                    handleInput(lane);
                }
            }
        });

        canvas.addEventListener('touchstart', (e) => {
            if (!isPlaying) return;
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                const lane = Math.floor(((touch.clientX - START_X) / (LANE_WIDTH * LANES)) * LANES);
                if (lane >= 0 && lane < LANES) {
                    if (isEditorMode) {
                        handleEditorInput(lane);
                    } else {
                        handleInput(lane);
                    }
                }
            }
        }, { passive: false });

        function handleEditorInput(lane) {
            hitEffects[lane] = 1;
            const now = audioCtx.currentTime - startTime + SYNC_OFFSET;
            recordedNotes.push({ lane: lane, time: now, hit: false, missed: false });
            createParticles(lane);
            spawnTextEffect("RECORD!", "#ff00ff");
        }

        function handleInput(lane) {
            hitEffects[lane] = 1;
            const now = audioCtx.currentTime - startTime + SYNC_OFFSET;
            
            let targetNote = null;
            let minDiff = Infinity;
            
            for (let i = 0; i < notes.length; i++) {
                let note = notes[i];
                if (note.lane === lane && !note.hit && !note.missed) {
                    let diff = Math.abs(note.time - now);
                    if (diff < minDiff) {
                        minDiff = diff;
                        targetNote = note;
                    }
                }
            }

            if (targetNote && targetNote.time - now > JUDGE.GOOD) return;

            if (targetNote && minDiff <= JUDGE.GOOD) {
                targetNote.hit = true;
                createParticles(lane);
                
                if (minDiff <= JUDGE.PERFECT) processHitResult('PERFECT');
                else if (minDiff <= JUDGE.GREAT) processHitResult('GREAT');
                else processHitResult('GOOD');
            }
        }

        function processHitResult(result) {
            let msg = ""; 
            switch(result) {
                case 'PERFECT': gameScore += 100; combo++; hp = Math.min(100, hp + 2); msg = "PERFECT"; break;
                case 'GREAT': gameScore += 50; combo++; hp = Math.min(100, hp + 1); msg = "GREAT"; break;
                case 'GOOD': gameScore += 10; combo++; msg = "GOOD"; break;
                case 'MISS': combo = 0; hp -= 15; msg = "MISS"; break;
            }

            if (combo > maxCombo) maxCombo = combo;
            updateHUD();
            spawnTextEffect(msg, result === 'MISS' ? '#f00' : '#0ff');

            if (hp <= 0 && !isInvincible) {
                endGame("GAME OVER");
            }
        }

        function updateHUD() {
            scoreText.innerText = gameScore;
            comboDisplay.innerText = combo > 3 ? `${combo}` : '';
            hpBar.style.width = hp + '%';
            if (hp > 60) hpBar.style.backgroundColor = '#0f0';
            else if (hp > 25) hpBar.style.backgroundColor = '#ff0';
            else hpBar.style.backgroundColor = '#f00';
        }

        function spawnTextEffect(text, color) {
            textEffects.push({ text, color, y: JUDGMENT_Y - 40, alpha: 1, life: 1 });
        }

        function createParticles(lane) {
            const x = START_X + lane * LANE_WIDTH + LANE_WIDTH / 2;
            const y = JUDGMENT_Y;
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 350,
                    vy: (Math.random() - 1) * 300,
                    life: 0.8,
                    color: Math.random() > 0.3 ? '#0ff' : '#fff'
                });
            }
        }

        let particles = [];
        let textEffects = [];
        let hitEffects = [0, 0, 0, 0];
        let gameScore = 0;
        let combo = 0;
        let maxCombo = 0;
        let hp = 100;

        function updateAndDrawParticles(dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= dt * 2.5;
                if (p.life <= 0) { particles.splice(i, 1); continue; }
                
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
            }
            ctx.globalAlpha = 1;

            ctx.textAlign = "center";
            ctx.font = "bold 28px 'Arial Black', sans-serif";
            for (let i = textEffects.length - 1; i >= 0; i--) {
                let t = textEffects[i];
                t.y -= 35 * dt;
                t.life -= dt * 2;
                if (t.life <= 0) { textEffects.splice(i, 1); continue; }
                
                ctx.fillStyle = t.color;
                ctx.globalAlpha = t.life;
                ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
                ctx.strokeText(t.text, w / 2, t.y);
                ctx.fillText(t.text, w / 2, t.y);
            }
            ctx.globalAlpha = 1;
        }
    </script>
</body>
